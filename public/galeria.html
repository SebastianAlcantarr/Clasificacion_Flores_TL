<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16171b">
<title>Galería de flores</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#16171b;color:#f2f2f2;font-family:system-ui,sans-serif}
figure{margin:0;width:min(92vw,420px)}
img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:.5rem;background:#0d0e11}
figcaption{padding:.75rem;text-align:center;font-size:1.4rem;font-weight:700;text-transform:capitalize}
nav{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;width:min(92vw,420px)}
button{padding:.8rem;font-size:1.3rem;font-weight:700;border:0;border-radius:.5rem;background:#ffb000;color:#0b0b0d}
button:active{background:#ffc533}
</style>
</head>
<body>
<figure><img id="img" alt=""><figcaption id="nombre"></figcaption></figure>
<nav><button id="ant" aria-label="Anterior">&lt;</button><button id="sig" aria-label="Siguiente">&gt;</button></nav>
<script>
let lista=[],i=0;
const img=document.getElementById('img'),nombre=document.getElementById('nombre');
function ver(){const[r,n]=lista[i];img.src=r;img.alt=n;nombre.textContent=n;}
function mover(d){i=(i+d+lista.length)%lista.length;ver();}
document.getElementById('ant').onclick=()=>mover(-1);
document.getElementById('sig').onclick=()=>mover(1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')mover(-1);if(e.key==='ArrowRight')mover(1);});
fetch('galeria/lista.json').then(r=>r.json()).then(l=>{lista=l;ver();});
</script>
</body>
</html>
