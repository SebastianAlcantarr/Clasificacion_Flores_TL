<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reconocimiento de flores con redes neuronales, directo en el navegador con TensorFlow.js.">
    <meta name="theme-color" content="#16171b">
    <title>Reconocimiento de flores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>
  <body class="min-h-screen font-sans antialiased">

    <main class="mx-auto max-w-7xl px-3 py-4 sm:px-6 sm:py-8">
      <h1 class="sr-only">Reconocimiento de flores</h1>
      <p id="estado-modelos" class="aviso" role="alert" hidden></p>
      <button id="reintentar" class="btn mb-3" hidden>Reintentar</button>
      <div id="carga" class="carga" hidden>
        <div class="carga-fila"><span id="carga-texto">Cargando modelo…</span><span id="carga-pct">0%</span></div>
        <div class="carga-pista" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Cargando modelo"><div id="carga-barra" class="carga-relleno"></div></div>
      </div>

      <section id="panel-flores" class="layout">
        <div class="win area-a">
          <div class="win-title"><h2>Cámara</h2></div>
          <div class="win-body gap-4">
            <div class="camara-marco">
              <video id="video" class="absolute inset-0 size-full object-cover" playsinline muted autoplay></video>
              <img id="foto" class="absolute inset-0 size-full object-cover" alt="Imagen subida" hidden>
              <div id="stage-vacio" class="vacio absolute inset-0 grid place-items-center">
                <p>Muestra una flor</p>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button id="camara" class="btn btn-default">Activar cámara</button>
              <button id="cambiar-camara" class="btn" disabled>Cambiar cámara</button>
              <button id="cambiar-modelo" class="btn col-span-2">Modelo: MobileNetV2</button>
              <label class="btn col-span-2">
                Subir una foto
                <input id="archivo" type="file" accept="image/*" class="sr-only">
              </label>
            </div>
            <p id="camara-error" class="text-sm font-semibold empty:hidden" role="alert"></p>
          </div>
        </div>

        <div class="win area-m">
          <div class="win-title"><h2>Lo que ve la red</h2></div>
          <div class="win-body">
            <div class="pixeles">
              <canvas id="entrada" width="160" height="160" aria-label="Recorte de 160 por 160 píxeles que recibe la red"></canvas>
            </div>
          </div>
        </div>

        <div class="win area-c" id="win-mobilenet">
          <div class="win-title"><h2>MobileNetV2</h2></div>
          <div class="win-body gap-2">
            <div id="nombre-mobilenet" class="apagado text-4xl font-bold capitalize" aria-live="polite">?</div>
            <p id="conf-mobilenet" class="text-sm text-[var(--muted)]">—</p>
            <p id="otros-mobilenet" class="text-xs text-[var(--muted)]"></p>
          </div>
        </div>

        <div class="win area-r" id="win-efficientnet" hidden>
          <div class="win-title"><h2>EfficientNetB0</h2></div>
          <div class="win-body gap-2">
            <div id="nombre-efficientnet" class="apagado text-4xl font-bold capitalize" aria-live="polite">?</div>
            <p id="conf-efficientnet" class="text-sm text-[var(--muted)]">—</p>
            <p id="otros-efficientnet" class="text-xs text-[var(--muted)]"></p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
