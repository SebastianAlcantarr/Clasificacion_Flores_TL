<!doctype html><html lang="es"><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#f4ecd8;font-family:"Space Grotesk",sans-serif;color:#141210;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 56px;border-bottom:3px solid #141210}
h1{margin:0;font-size:44px;text-transform:uppercase;letter-spacing:-.02em}
nav span{font:600 18px "Space Grotesk";padding:8px 16px;border:2px solid #141210;margin-left:8px}nav .on{background:#d7262e;color:#f4ecd8}
main{display:grid;grid-template-columns:460px 1fr;gap:56px;padding:40px 56px}
.card{border:10px solid #141210;background:#fff;padding:14px;display:flex;flex-direction:column;height:620px;box-sizing:border-box}
.num{font:700 40px "JetBrains Mono"}.art{flex:1;border:2px solid #141210;margin:8px 0;background:#fffdf6;display:grid;place-items:center;font-size:260px;font-weight:700;color:#141210}
.band{border:2px solid #141210;background:#f2b705;text-align:center;font:700 34px "Space Grotesk";text-transform:uppercase;padding:6px}
.tabla{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.c{border:6px solid #141210;background:#fff;height:290px;display:flex;flex-direction:column;padding:8px;box-sizing:border-box;color:#a59e8e}
.c b{font:700 22px "JetBrains Mono";color:#141210}.c i{flex:1;display:grid;place-items:center;font-style:normal;font-size:110px;font-weight:700}
.c u{text-decoration:none;border-top:2px solid #141210;text-align:center;font:600 16px "Space Grotesk";text-transform:uppercase;color:#141210;padding-top:4px}
.c.win{background:#d7262e;color:#f4ecd8}.c.win u,.c.win b{color:#f4ecd8;border-color:#f4ecd8}
.bean{display:inline-block;width:14px;height:10px;border-radius:50%;background:#5a3a1e;margin:1px}
</style><body>
<header><h1>Tarea de Redes Neuronales</h1><nav><span class="on">Números</span><span>Perros y gatos</span></nav></header>
<main><div class="card"><div class="num">¿?</div><div class="art">5</div><div class="band">Dibuja aquí</div></div>
<div class="tabla">
<div class="c"><b>0</b><i>0</i><u>El cero</u></div><div class="c"><b>1</b><i>1</i><u>El uno</u></div><div class="c"><b>2</b><i>2</i><u>El dos</u></div><div class="c"><b>3</b><i>3</i><u>El tres · <span class="bean"></span></u></div><div class="c"><b>4</b><i>4</i><u>El cuatro</u></div>
<div class="c win"><b>5</b><i>5</i><u>¡El cinco! 94%</u></div><div class="c"><b>6</b><i>6</i><u>El seis · <span class="bean"></span></u></div><div class="c"><b>7</b><i>7</i><u>El siete</u></div><div class="c"><b>8</b><i>8</i><u>El ocho</u></div><div class="c"><b>9</b><i>9</i><u>El nueve</u></div>
</div></main></body></html>
