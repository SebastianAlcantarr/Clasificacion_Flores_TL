<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#1b8a5a;font-family:Georgia,serif;color:#111;padding:40px 70px}
h1{color:#ffc93c;font-size:54px;letter-spacing:2px;text-transform:uppercase}.w{display:grid;grid-template-columns:520px 1fr;gap:40px;margin-top:26px}
.card{background:#fffaf0;border:12px solid #d7263d;border-radius:16px;height:620px;padding:16px;position:relative;text-align:center}
.card .n{position:absolute;top:10px;left:18px;font-size:34px;color:#d7263d}.card .big{font-size:300px;line-height:1.1;color:#1f5fbf;margin-top:50px}.card p{font-size:40px;text-transform:uppercase;letter-spacing:3px;color:#d7263d}
.tab{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tab div{background:#fffaf0;border:6px solid #1f5fbf;border-radius:10px;height:140px;font-size:56px;text-align:center;padding-top:30px;position:relative}.tab .f:after{content:"";position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:#7a4b22}
</style></head><body><h1>¡Lotería de Redes Neuronales!</h1><div class="w"><div class="card"><span class="n">7</span><div class="big">7</div><p>El Siete</p></div><div class="tab"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div class="f">7</div><div>8</div><div>9</div><div style="background:#000"></div><div style="background:#000"></div></div></div></body></html>
