<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;font-family:Georgia,serif;color:#1d3b8b;background:#f7fbff;background-image:linear-gradient(#cfe3f7 1px,transparent 1px),linear-gradient(90deg,#cfe3f7 1px,transparent 1px);background-size:28px 28px;padding:48px 110px;position:relative}
body:before{content:"";position:absolute;left:84px;top:0;bottom:0;width:2px;background:#d62839}
h1{font-size:58px;font-weight:400;font-style:italic}.wrap{display:grid;grid-template-columns:1fr 360px 1fr;gap:40px;margin-top:40px}
.box{background:#fff;border:2px solid #1d3b8b;height:420px;padding:12px}.lab{font-size:22px;margin-bottom:8px}.red{color:#d62839;font-size:130px;font-style:italic;transform:rotate(-6deg);text-align:center;margin-top:50px}
.nota{color:#d62839;font-size:26px;font-style:italic;margin-top:12px}.b{height:14px;background:#7fb2e5;margin:7px 0}
</style></head><body><h1>Tarea de Redes Neuronales</h1><div class="wrap"><div><p class="lab">1. Dibuja tu número</p><div class="box"></div></div><div><p class="lab">2. Así lo ve la red (28×28)</p><div class="box" style="height:340px"></div></div><div><p class="lab">3. Respuesta de la red</p><div class="box"><div class="red">7 ✓</div></div><p class="nota">¡Muy bien! 97% segura</p></div></div></body></html>
