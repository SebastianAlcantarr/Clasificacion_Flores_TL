<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#1b3fa0;font-family:Arial Black,Impact,sans-serif;color:#fff;padding:36px 56px}
h1{font-size:54px;text-transform:uppercase;color:#ffcc00;letter-spacing:-1px;transform:rotate(-1deg)}
.pg{display:grid;grid-template-columns:560px 1fr;gap:36px;margin-top:26px}.slot{background:#0f2a75;border:5px dashed #7f9be0;border-radius:14px;padding:14px;position:relative}
.slot b{position:absolute;top:-18px;left:16px;background:#ffcc00;color:#1b3fa0;padding:4px 14px;font-size:20px;border-radius:6px}
.cv{background:#000;height:470px;border-radius:8px}.est{background:#fff;color:#1b3fa0;border:10px solid #fff;outline:4px solid #e4002b;text-align:center;font-size:170px;line-height:1.1;height:300px;box-shadow:0 0 0 8px #ffcc00;transform:rotate(-3deg)}
.mini{background:#000;width:200px;height:200px;float:right;border:8px solid #fff;transform:rotate(3deg)}
.tira{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:22px}.tira div{height:130px;border:4px dashed #7f9be0;border-radius:10px;font-size:34px;padding:6px;color:#7f9be0}.tira .w{background:#fff;color:#e4002b;border:6px solid #ffcc00;transform:rotate(-4deg)}
</style></head><body><h1>Álbum de Redes Neuronales</h1><div class="pg"><div class="slot"><b>Nº 1 · DIBUJA</b><div class="cv"></div></div><div><div class="slot"><b>Nº 2 · LA RED VE</b><div class="mini"></div><div class="est">7</div></div><div class="tira"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div class="w">7<br>97%</div><div>8</div><div>9</div></div></div></div></body></html>
