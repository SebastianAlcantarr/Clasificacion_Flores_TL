<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#ffd23f;font-family:Arial Black,Impact,sans-serif;color:#14213d;padding:36px 56px}
h1{font-size:64px;line-height:.95;text-transform:uppercase;color:#e63946;text-shadow:4px 4px 0 #14213d;letter-spacing:-1px}
.tabs{position:absolute;top:36px;right:56px;display:flex;gap:12px}.tabs span{background:#14213d;color:#fff6e0;padding:12px 22px;font-size:20px;transform:rotate(-2deg)}.tabs span+span{background:#0aa5a8;transform:rotate(1.5deg)}
.grid{display:grid;grid-template-columns:520px 1fr 1fr;gap:28px;margin-top:34px}
.sign{background:#fff6e0;border:8px solid #14213d;box-shadow:8px 8px 0 #14213d;padding:18px;position:relative}
.sign h2{font-size:26px;text-transform:uppercase;margin-bottom:12px}.num{position:absolute;top:-26px;left:-20px;width:56px;height:56px;border-radius:50%;background:#e63946;color:#fff;font-size:30px;display:grid;place-items:center;border:5px solid #14213d}
.pad{background:#111;height:400px}.mini{background:#111;height:240px;width:240px;margin:auto}
.big{font-size:190px;line-height:1;color:#e63946;text-shadow:8px 8px 0 #14213d;text-align:center}
.cinta{background:#0aa5a8;color:#fff;padding:10px 16px;margin:16px -18px -18px;font-size:20px;text-transform:uppercase}
.bar{height:16px;background:#14213d;margin:6px 0;width:80%}.bar.b{background:#0aa5a8;width:20%}.arrow{position:absolute;right:-34px;top:45%;font-size:50px;color:#e63946;z-index:2}
</style></head><body><h1>Tarea de<br>Redes Neuronales</h1><div class="tabs"><span>NÚMEROS</span><span>PERROS Y GATOS</span></div>
<div class="grid"><div class="sign"><div class="num">1</div><h2>Dibuja un número</h2><div class="pad"></div><div class="cinta">¡Dibújalo grande!</div><span class="arrow">➜</span></div>
<div class="sign"><div class="num">2</div><h2>Lo que ve la red</h2><div class="mini"></div><div class="cinta">Así lo lee: 28 × 28</div><span class="arrow">➜</span></div>
<div class="sign"><div class="num">3</div><h2>Responde</h2><div class="big">7</div><div class="bar"></div><div class="bar b"></div><div class="cinta">¡Seguro: 97%!</div></div></div></body></html>
